property.filename = logging4j2-test

rootLogger.level = debug
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = logfile

appender.console.type = Console
appender.console.name = STDOUT
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = info
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%c] %x %X %highlight{%m}%n

appender.rolling.type = RollingFile
appender.rolling.name = logfile
appender.rolling.fileName = /tmp/${filename}.log
appender.rolling.filePattern = /tmp/${filename}-%d{MM-dd-yy-HH-mm-ss}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{DEFAULT} %-5p [%c] - %x %X - %m%n
appender.rolling.policies.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 5
